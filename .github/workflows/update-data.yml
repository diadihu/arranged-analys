name: Sync Lottery Data

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild predictions even when no new draw is available"
        required: false
        default: false
        type: boolean

# The official API rejects GitHub-hosted and Vercel cloud egress with HTTP 567.
# Keep this workflow manual for future connectivity diagnostics; local scheduling
# performs the production sync and pushes generated data to main.

concurrency:
  group: sync-lottery-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build latest history and site data
        shell: bash
        run: |
          if [[ "${{ inputs.force_rebuild }}" == "true" ]]; then
            python scripts/build_site.py --force-rebuild
          else
            python scripts/build_site.py
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --short)" ]; then
            git add data/raw data/processed docs/data
            git commit -m "chore: refresh lottery history data"
            git push
          else
            echo "No changes to commit."
          fi
